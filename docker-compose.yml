services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=data/di_cases.db
    volumes:
      - di_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api

volumes:
  di_data:

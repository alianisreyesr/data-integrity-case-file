services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=data/di_cases.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TIMEOUT_SECONDS=180
    volumes:
      - di_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# After first `docker compose up --build`, pull the model once:
#   docker compose exec ollama ollama pull llama3.2:3b
# The model persists in the ollama_data volume on subsequent runs.

volumes:
  di_data:
  ollama_data:

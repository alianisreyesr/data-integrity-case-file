services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=data/di_cases.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TIMEOUT_SECONDS=180
      - ENVIRONMENT=production
      - API_KEY=${API_KEY:?Set API_KEY to a private value (see README)}
      # Comma-separated IPs/CIDRs of reverse proxies whose X-Forwarded-For is trusted.
      # Empty (default): the header is ignored and the socket peer is rate-limited.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-120}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - RATE_LIMIT_AI=${RATE_LIMIT_AI:-10}
      - RATE_LIMIT_AI_WINDOW_SECONDS=${RATE_LIMIT_AI_WINDOW_SECONDS:-60}
    volumes:
      - di_data:/app/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      - API_KEY=${API_KEY:?Set API_KEY to a private value (see README)}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.14
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[ollama-init] Waiting for Ollama service..."
        until curl -sf http://ollama:11434/api/tags > /dev/null; do
          sleep 2
        done
        echo "[ollama-init] Pulling model: $${OLLAMA_MODEL}"
        OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_MODEL}
        echo "[ollama-init] Model ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  di_data:
  ollama_data:

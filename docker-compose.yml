services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=data/di_cases.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TIMEOUT_SECONDS=180
    volumes:
      - di_data:/app/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-shot init: pulls the configured model if not already present.
  # Runs to completion before the API starts; safe to re-run (ollama pull
  # is idempotent when the model is already cached in the volume).
  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[ollama-init] Waiting for Ollama service..."
        until curl -sf http://ollama:11434/api/tags > /dev/null; do
          sleep 2
        done
        echo "[ollama-init] Pulling model: $${OLLAMA_MODEL}"
        OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_MODEL}
        echo "[ollama-init] Model ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  di_data:
  ollama_data:
